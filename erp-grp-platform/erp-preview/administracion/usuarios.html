<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Usuarios · ERP Preview</title>
<link rel="stylesheet" href="../assets/css/tokens.css"/>
<link rel="stylesheet" href="../assets/css/shell.css"/>
<link rel="stylesheet" href="../assets/css/components.css"/>
</head><body data-depth="..">
<div class="app" id="app"><main class="main" id="main"><div id="content"></div>
<p class="footer-note">ERP Preview · ERP-SI-001 / ERP-FM-001 · sin backend</p></main></div>
<script src="../assets/js/data.js"></script>

<script>
document.addEventListener('DOMContentLoaded',()=>{
  const D=ERPDemo;
  document.getElementById('content').innerHTML = 
crumbs([{label:'Administración',href:'index.html'},{label:'Usuarios'}])+
pageHead('Administración de usuarios', 'FM §1.10', '')+
`<div class="table-wrap"><table class="data"><thead><tr><th>username</th><th>full_name</th><th>email</th><th>org_unit_id</th><th>role_codes</th><th>status</th></tr></thead>
<tbody>${D.users.map(u=>`<tr><td><strong>${u.username}</strong></td><td>${u.full_name}</td><td>${u.email}</td><td>${u.org_unit_id}</td><td><span class="chip">${u.role_codes}</span></td><td>${D.badge(u.status)}</td></tr>`).join('')}</tbody></table></div>
;
  
});
</script></body></html>
