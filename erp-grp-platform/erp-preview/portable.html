<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ACME ERP · Demo portable P0</title>
<style>
:root {
  --font: system-ui, 'Segoe UI', sans-serif;
  --mono: ui-monospace, 'Cascadia Mono', monospace;
  --bg: #f0f2f5;
  --bg-soft: #e8ecf1;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --ink: #1a2332;
  --ink-2: #4a5568;
  --ink-3: #718096;
  --border: #d8dee6;
  --border-strong: #b8c2ce;
  /* Fiori/Fusion-inspired enterprise blue — not purple */
  --brand: #0a6ed1;
  --brand-hover: #0854a0;
  --brand-soft: #e8f3fc;
  --brand-ink: #064a8c;
  --accent: #243141;
  --ok: #107e3e;
  --ok-soft: #e3f5ea;
  --warn: #e9730c;
  --warn-soft: #fef3e8;
  --danger: #bb0000;
  --danger-soft: #fce8e8;
  --info: #0a6ed1;
  --info-soft: #e8f3fc;
  --sidebar-w: 260px;
  --header-h: 52px;
  --radius: 4px;
  --shadow: 0 1px 3px rgba(26, 35, 50, 0.08);
  --ease: 180ms ease;
}

[data-theme='dark'] {
  --bg: #0f1419;
  --bg-soft: #161c24;
  --surface: #1a222d;
  --surface-2: #222b38;
  --ink: #e8eef5;
  --ink-2: #a8b5c4;
  --ink-3: #7a8796;
  --border: #2d3848;
  --border-strong: #3d4b5e;
  --brand: #4db1ff;
  --brand-hover: #7ec5ff;
  --brand-soft: rgba(77, 177, 255, 0.12);
  --brand-ink: #b3dbff;
  --ok: #3dd68c;
  --ok-soft: rgba(61, 214, 140, 0.12);
  --warn: #f5a623;
  --warn-soft: rgba(245, 166, 35, 0.12);
  --danger: #ff5c5c;
  --danger-soft: rgba(255, 92, 92, 0.12);
  --info-soft: rgba(77, 177, 255, 0.12);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.45;
}
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }

.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: var(--header-h) 1fr;
  min-height: 100vh;
}
.app.collapsed { grid-template-columns: 64px 1fr; }

.sidebar {
  grid-row: 1 / -1;
  background: var(--accent);
  color: #dce4ee;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: sticky;
  top: 0;
  height: 100vh;
  z-index: 30;
}
.brand {
  height: var(--header-h);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  border-bottom: 1px solid rgba(255,255,255,.08);
  flex-shrink: 0;
}
.brand-mark {
  width: 28px; height: 28px; border-radius: 4px;
  background: var(--brand); color: #fff;
  display: grid; place-items: center;
  font-size: 11px; font-weight: 700;
  flex-shrink: 0;
}
.brand-text { font-size: 13px; font-weight: 600; white-space: nowrap; }
.brand-text span { display: block; font-size: 10px; font-weight: 400; opacity: .65; }
.app.collapsed .brand-text,
.app.collapsed .nav-label,
.app.collapsed .nav-sec { opacity: 0; width: 0; overflow: hidden; }

.nav { flex: 1; overflow-y: auto; padding: 8px; }
.nav-sec {
  font-size: 10px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: rgba(220,228,238,.45);
  padding: 12px 10px 4px; white-space: nowrap;
}
.nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--radius);
  color: rgba(220,228,238,.88); font-size: 13px; font-weight: 500;
  margin-bottom: 1px;
}
.nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav a.active { background: rgba(10,110,209,.35); color: #fff; }
.nav .ico { width: 18px; text-align: center; opacity: .85; flex-shrink: 0; font-size: 13px; }
.nav .badge {
  margin-left: auto; background: #bb0000; color: #fff;
  font-size: 10px; font-weight: 700; min-width: 16px; height: 16px;
  border-radius: 8px; display: grid; place-items: center; padding: 0 4px;
}

.topbar {
  grid-column: 2;
  height: var(--header-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  padding: 0 16px; position: sticky; top: 0; z-index: 20;
}
.icon-btn {
  width: 34px; height: 34px; border: none; border-radius: var(--radius);
  background: transparent; color: var(--ink-2); display: grid; place-items: center;
}
.icon-btn:hover { background: var(--bg-soft); color: var(--ink); }
.search {
  flex: 1; max-width: 420px; position: relative;
}
.search input {
  width: 100%; height: 34px; border: 1px solid var(--border);
  border-radius: var(--radius); background: var(--surface-2);
  padding: 0 10px 0 32px; outline: none;
}
.search input:focus { border-color: var(--brand); background: var(--surface); }
.search .si { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.top-actions { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.user-chip {
  display: flex; align-items: center; gap: 8px;
  padding: 2px 8px 2px 2px; border: 1px solid var(--border);
  border-radius: 20px; background: var(--surface); margin-left: 6px;
}
.avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--brand); color: #fff;
  display: grid; place-items: center; font-size: 11px; font-weight: 700;
}
.user-meta { line-height: 1.15; }
.user-meta strong { display: block; font-size: 12px; }
.user-meta span { font-size: 10px; color: var(--ink-3); }
.dot-alert { position: relative; }
.dot-alert::after {
  content: ''; position: absolute; top: 6px; right: 6px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--danger); border: 2px solid var(--surface);
}

.main { grid-column: 2; padding: 16px 20px 40px; min-width: 0; }
.crumbs {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  font-size: 12px; color: var(--ink-3); margin-bottom: 10px;
}
.crumbs a:hover { color: var(--brand); }
.crumbs .sep { opacity: .5; }

.page-hd {
  display: flex; flex-wrap: wrap; justify-content: space-between;
  align-items: flex-start; gap: 12px; margin-bottom: 16px;
}
.page-hd h1 {
  margin: 0 0 2px; font-size: 22px; font-weight: 700;
  letter-spacing: -.02em;
}
.page-hd p { margin: 0; color: var(--ink-2); font-size: 13px; }
.page-actions { display: flex; flex-wrap: wrap; gap: 8px; }

@media (max-width: 960px) {
  .app, .app.collapsed { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; transform: translateX(-105%);
    width: min(86vw, 280px); transition: transform var(--ease);
  }
  .app.mobile-open .sidebar { transform: none; }
  .topbar, .main { grid-column: 1; }
  .user-meta { display: none; }
}

.login-wrap {
  min-height: 100vh; display: grid; place-items: center;
  background:
    linear-gradient(160deg, #1a2332 0%, #243141 45%, #0a6ed1 140%);
  padding: 24px;
}
.login-card {
  width: min(400px, 100%);
  background: var(--surface);
  border-radius: 8px;
  padding: 28px;
  box-shadow: 0 16px 48px rgba(0,0,0,.25);
}
.login-card h1 { margin: 0 0 4px; font-size: 20px; }
.login-card .sub { margin: 0 0 20px; color: var(--ink-3); font-size: 13px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 12px; border-radius: var(--radius);
  border: 1px solid transparent; font-size: 13px; font-weight: 600;
  background: transparent;
}
.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-hover); }
.btn-secondary { background: var(--surface); border-color: var(--border-strong); color: var(--ink); }
.btn-secondary:hover { background: var(--surface-2); }
.btn-ghost { color: var(--ink-2); }
.btn-ghost:hover { background: var(--bg-soft); }
.btn-danger { background: var(--danger-soft); color: var(--danger); }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }

.kpi-row {
  display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-bottom: 16px;
}
@media (max-width: 1100px) { .kpi-row { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 560px) { .kpi-row { grid-template-columns: 1fr; } }

.kpi {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow);
}
.kpi .l { font-size: 11px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
.kpi .v { font-size: 22px; font-weight: 700; margin-top: 6px; letter-spacing: -.02em; }
.kpi .d { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.kpi .d.up { color: var(--ok); } .kpi .d.down { color: var(--danger); }

.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden;
}
.panel-hd {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2);
}
.panel-hd h2, .panel-hd h3 { margin: 0; font-size: 14px; font-weight: 650; }
.panel-bd { padding: 14px; }

.grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
@media (max-width: 1000px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar .spacer { flex: 1; }

.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.field .req::after { content: ' *'; color: var(--danger); }
.field .hint { font-size: 11px; color: var(--ink-3); }
.control {
  height: 32px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); padding: 0 10px; width: 100%; outline: none;
}
.control:focus { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
textarea.control { height: auto; min-height: 80px; padding: 8px 10px; resize: vertical; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 720px) { .form-grid { grid-template-columns: 1fr; } }

.table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: var(--radius); }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
table.data th {
  text-align: left; padding: 8px 10px; background: var(--surface-2);
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
  color: var(--ink-2); border-bottom: 1px solid var(--border); white-space: nowrap;
}
table.data td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.data tr:hover td { background: var(--brand-soft); }
table.data tr.clickable { cursor: pointer; }

.badge {
  display: inline-flex; align-items: center; height: 20px; padding: 0 7px;
  border-radius: 3px; font-size: 11px; font-weight: 700; white-space: nowrap;
}
.b-ok { background: var(--ok-soft); color: var(--ok); }
.b-warn { background: var(--warn-soft); color: var(--warn); }
.b-danger { background: var(--danger-soft); color: var(--danger); }
.b-info { background: var(--info-soft); color: var(--brand-ink); }
.b-neu { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border); }

.list-row {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.list-row:last-child { border-bottom: none; }

.alert {
  padding: 10px 12px; border-radius: var(--radius); font-size: 13px;
  background: var(--info-soft); color: var(--brand-ink); margin-bottom: 12px;
}
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert.danger { background: var(--danger-soft); color: var(--danger); }

.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 14px; overflow-x: auto; }
.tab {
  border: none; background: transparent; padding: 8px 14px;
  font-weight: 600; font-size: 13px; color: var(--ink-3);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab.active { color: var(--brand-ink); border-bottom-color: var(--brand); }

.timeline { position: relative; padding-left: 18px; }
.timeline::before {
  content: ''; position: absolute; left: 4px; top: 4px; bottom: 4px;
  width: 2px; background: var(--border-strong);
}
.tl { position: relative; padding: 0 0 14px 8px; }
.tl:last-child { padding-bottom: 0; }
.tl::before {
  content: ''; position: absolute; left: -18px; top: 3px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--brand);
}
.tl.done::before { background: var(--brand); }
.tl h4 { margin: 0 0 2px; font-size: 13px; }
.tl p, .tl time { margin: 0; font-size: 12px; color: var(--ink-3); }

.toast-host { position: fixed; right: 16px; bottom: 16px; z-index: 80; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--ink); color: var(--bg); padding: 10px 14px;
  border-radius: var(--radius); font-size: 13px; min-width: 220px;
}
[data-theme='dark'] .toast { background: #e8eef5; color: #0f1419; }

.chip {
  display: inline-flex; height: 22px; padding: 0 8px; border-radius: 11px;
  background: var(--brand-soft); color: var(--brand-ink); font-size: 11px; font-weight: 650;
}
.progress { height: 6px; border-radius: 3px; background: var(--bg-soft); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--brand); }

.empty { text-align: center; padding: 32px; color: var(--ink-3); }
.footer-note { font-size: 11px; color: var(--ink-3); margin-top: 20px; text-align: center; }

.field label .tech {
  font-weight: 400; font-size: 10px; color: var(--ink-3);
  margin-left: 4px; font-family: var(--mono);
}
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.lines-wrap { margin-top: 8px; }
.lines-wrap .control { height: 28px; padding: 0 6px; font-size: 12px; }

.match-panel {
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 14px; margin-bottom: 12px; background: var(--surface-2);
}
.match-panel.ok { border-color: var(--ok); background: var(--ok-soft); }
.match-panel.bad { border-color: var(--danger); background: var(--danger-soft); }
.match-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.match-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
}
@media (max-width: 720px) { .match-grid { grid-template-columns: 1fr; } }
.match-grid .l { font-size: 11px; color: var(--ink-3); font-weight: 600; }
.match-grid .v { font-size: 16px; font-weight: 700; margin-top: 2px; }
.match-flags { margin-top: 8px; font-size: 12px; color: var(--ink-2); }

.switcher select {
  max-width: 180px; height: 32px; border: 1px solid var(--border);
  border-radius: var(--radius); background: var(--surface); padding: 0 6px; font-size: 12px;
}
@media (max-width: 1100px) {
  .switcher select { max-width: 120px; }
  .user-meta { display: none; }
}

.journey {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  margin-bottom: 12px; font-size: 12px; color: var(--ink-3);
}
.journey strong { color: var(--brand-ink); }
.stub-tag {
  display: inline-flex; align-items: center; height: 18px; padding: 0 6px;
  border-radius: 3px; background: var(--warn-soft); color: var(--warn);
  font-size: 10px; font-weight: 700; margin-left: 6px;
}

</style>
</head>

/* Componentes UI preview — líneas, tabs, match 3-way, crédito */
(function () {
  window.linesTable = function (opts) {
    const cols = opts.cols; // [{key,label,type,width}]
    const rows = opts.rows || [];
    const editable = !!opts.editable;
    const id = opts.id || 'lines';
    const head = cols.map((c) => `<th>${c.label || L(c.key)}</th>`).join('') + (editable ? '<th></th>' : '');
    const body = rows.map((r, i) => `<tr data-i="${i}">${cols.map((c) => {
      const v = r[c.key] ?? '';
      if (!editable) return `<td>${c.money ? ERPDemo.money(v) : v}</td>`;
      if (c.type === 'select' && c.options) {
        return `<td><select class="control line-input" data-k="${c.key}">${c.options.map((o) =>
          `<option value="${o}" ${String(o) === String(v) ? 'selected' : ''}>${o}</option>`).join('')}</select></td>`;
      }
      return `<td><input class="control line-input" data-k="${c.key}" type="${c.type || 'text'}" value="${v}"/></td>`;
    }).join('')}${editable ? `<td><button type="button" class="btn btn-ghost btn-sm" data-rm="${i}">✕</button></td>` : ''}</tr>`).join('');

    return `<div class="lines-wrap" id="${id}">
      <div class="toolbar"><strong>Líneas</strong>
        ${editable ? `<button type="button" class="btn btn-secondary btn-sm" data-add="${id}">+ Línea</button>` : ''}
        <span class="spacer"></span>
        <span class="chip" id="${id}-total">Total: ${ERPDemo.money(opts.total || sumLines(rows, opts.qtyKey || 'qty', opts.priceKey || 'price'))}</span>
      </div>
      <div class="table-wrap"><table class="data" id="${id}-table"><thead><tr>${head}</tr></thead><tbody>${body || '<tr><td colspan="99" class="empty">Sin líneas</td></tr>'}</tbody></table></div>
    </div>`;
  };

  function sumLines(rows, qk, pk) {
    return (rows || []).reduce((s, r) => s + (Number(r[qk]) || 0) * (Number(r[pk]) || 0), 0);
  }

  window.bindLinesTable = function (id, state) {
    const root = document.getElementById(id);
    if (!root) return;
    root.addEventListener('click', (e) => {
      if (e.target.dataset.add === id) {
        state.rows.push(Object.assign({}, state.blank || {}));
        rerender();
      }
      if (e.target.dataset.rm != null) {
        state.rows.splice(Number(e.target.dataset.rm), 1);
        rerender();
      }
    });
    root.addEventListener('input', (e) => {
      if (!e.target.classList.contains('line-input')) return;
      const tr = e.target.closest('tr');
      const i = Number(tr.dataset.i);
      state.rows[i][e.target.dataset.k] = e.target.type === 'number' ? Number(e.target.value) : e.target.value;
      const tot = sumLines(state.rows, state.qtyKey || 'qty', state.priceKey || 'price');
      const el = document.getElementById(id + '-total');
      if (el) el.textContent = 'Total: ' + ERPDemo.money(tot);
      if (state.onChange) state.onChange(tot, state.rows);
    });
    function rerender() {
      const parent = root.parentNode;
      const html = linesTable({
        id, cols: state.cols, rows: state.rows, editable: true,
        qtyKey: state.qtyKey, priceKey: state.priceKey,
        total: sumLines(state.rows, state.qtyKey || 'qty', state.priceKey || 'price')
      });
      root.outerHTML = html;
      bindLinesTable(id, state);
    }
  };

  window.objectTabs = function (tabs, active) {
    // tabs: [{id,label,html}]
    const act = active || tabs[0].id;
    return `<div class="tabs" role="tablist">${tabs.map((t) =>
      `<button type="button" class="tab ${t.id === act ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`
    ).join('')}</div>
    <div class="tab-panels">${tabs.map((t) =>
      `<div class="tab-panel ${t.id === act ? 'active' : ''}" data-panel="${t.id}">${t.html}</div>`
    ).join('')}</div>`;
  };

  window.bindObjectTabs = function (root) {
    const el = typeof root === 'string' ? document.querySelector(root) : root;
    if (!el) return;
    el.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-tab]');
      if (!btn) return;
      const id = btn.dataset.tab;
      el.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === id));
      el.querySelectorAll('.tab-panel').forEach((p) => p.classList.toggle('active', p.dataset.panel === id));
    });
  };

  window.matchPanel = function (inv) {
    if (!inv || !inv.match) {
      return `<div class="alert">Match 3-way no aplica (factura sin OC) · status ${inv ? inv.match_status : '—'}</div>`;
    }
    const m = inv.match;
    const ok = m.qty_ok && m.amt_ok;
    return `<div class="match-panel ${ok ? 'ok' : 'bad'}">
      <div class="match-hd"><strong>Match 3-way</strong> ${ok ? statusChip('MATCHED') : '<span class="badge b-danger">Descuadre</span>'}
        <span class="hint">tolerancia ±${m.tolerance_pct}%</span></div>
      <div class="match-grid">
        <div><div class="l">OC (${inv.po_id || '—'})</div><div class="v">${ERPDemo.money(m.po_amount)}</div></div>
        <div><div class="l">Recepción (${inv.gr_id || '—'})</div><div class="v">${ERPDemo.money(m.gr_amount)}</div></div>
        <div><div class="l">Factura (${inv.id})</div><div class="v">${ERPDemo.money(m.inv_amount)}</div></div>
      </div>
      <div class="match-flags">Cantidad: ${m.qty_ok ? '✓' : '✗'} · Importe: ${m.amt_ok ? '✓' : '✗'}</div>
    </div>`;
  };

  window.creditBanner = function (customer, orderAmount) {
    if (!customer) return '';
    const headroom = (customer.credit_limit || 0) - (customer.credit_exposure || 0);
    const wouldBlock = customer.credit_block || (orderAmount != null && orderAmount > headroom);
    if (customer.credit_block) {
      return `<div class="alert danger"><strong>Crédito bloqueado</strong> · ${customer.code} ${customer.name}
        · Límite ${ERPDemo.money(customer.credit_limit)} · Exposición ${ERPDemo.money(customer.credit_exposure)}
        · No confirmar pedido / facturar.</div>`;
    }
    if (wouldBlock) {
      return `<div class="alert danger"><strong>Excede crédito disponible</strong>
        · Disponible ${ERPDemo.money(headroom)} · Pedido ${ERPDemo.money(orderAmount)}
        · Requiere aprobación crédito (simulado).</div>`;
    }
    return `<div class="alert">Crédito OK · Límite ${ERPDemo.money(customer.credit_limit)}
      · Exposición ${ERPDemo.money(customer.credit_exposure)}
      · Disponible ${ERPDemo.money(headroom)}</div>`;
  };

  window.fieldL = function (key, controlHtml, req, full, hint) {
    return `<div class="field${full ? ' full' : ''}">
      <label${req ? ' class="req"' : ''}>${L(key)} <span class="tech" title="${key}">${key}</span></label>
      ${controlHtml}${hint ? `<span class="hint">${hint}</span>` : ''}
    </div>`;
  };

  window.auditStub = function (ref) {
    return `<div class="table-wrap"><table class="data"><thead><tr><th>Cuándo</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead>
      <tbody>
        <tr><td>2026-11-06 16:02</td><td>clopez</td><td>UPDATE</td><td class="mono">${ref} → PENDING_APPROVAL</td></tr>
        <tr><td>2026-11-06 15:40</td><td>clopez</td><td>CREATE</td><td class="mono">${ref}</td></tr>
      </tbody></table></div>`;
  };

  window.docsStub = function (ref) {
    return `<div class="table-wrap"><table class="data"><thead><tr><th>Documento</th><th>Tipo</th><th>Versión</th><th>Estado</th></tr></thead>
      <tbody>
        <tr><td>DOC-${ref}-1</td><td>PDF</td><td>1</td><td>${statusChip('AVAILABLE')}</td></tr>
      </tbody></table></div>
      <a class="btn btn-secondary btn-sm" href="../administracion/subir.html" style="margin-top:8px">Subir evidencia</a>`;
  };

  window.wfStub = function (steps) {
    return `<div class="timeline">${(steps || []).map((s) =>
      `<div class="tl ${s.done ? 'done' : ''}"><h4>${s.title}</h4><p>${s.desc || ''}</p><time>${s.when || ''}</time></div>`
    ).join('')}</div>`;
  };
})();

  function route(){
    const raw=location.hash.slice(1)||'login';
    const [name,id]=raw.split('/');
    if(name!=='login' && !sessionStorage.getItem('erp-demo-auth')){ location.hash='login'; return; }
    if(name==='login'){
      document.getElementById('app').style.display='none';
      document.getElementById('login-root').style.display='grid';
      return;
    }
    document.getElementById('login-root').style.display='none';
    document.getElementById('app').style.display='grid';
    ERPDemo.restoreSession();
    buildShell(name);
    let html;
    if(name.startsWith('detalle') && V[name]) html=V[name](id);
    else if(V[name]) html=typeof V[name]==='function' ? V[name](id) : V[name];
    else html=pageHead('No encontrado', name)+`<a class="btn btn-secondary" href="#dashboard">Dashboard</a>`;
    document.getElementById('content').innerHTML=html+`<p class="footer-note">ERP Portable P0 · labels ES · roles · líneas · match · ATP · crédito</p>`;
    afterRender(name);
  }

  window.addEventListener('hashchange', route);
  document.addEventListener('DOMContentLoaded', ()=>{
    if(/raw\.githubusercontent\.com/i.test(location.host)){
      document.body.innerHTML='<div style="font:16px system-ui;padding:32px;max-width:560px;margin:auto"><h1>Use raw.githack</h1><p><a href="https://raw.githack.com/arath-devops/Timbrado/feat-ERP/erp-grp-platform/erp-preview/portable.html">Abrir demo</a></p></div>';
      return;
    }
    const co=document.getElementById('company');
    const role=document.getElementById('role');
    const user=document.getElementById('username');
    ERPDemo.companies.forEach(c=>{ const o=document.createElement('option'); o.value=c.id; o.textContent=c.name; co.appendChild(o); });
    ERPDemo.roles.forEach(r=>{ const o=document.createElement('option'); o.value=r.id; o.textContent=r.label; role.appendChild(o); });
    role.value='GL';
    const sync=()=>{ user.value=(ERPDemo.roles.find(r=>r.id===role.value)||{}).username||''; };
    role.onchange=sync; sync();
    document.getElementById('login-form').onsubmit=(e)=>{
      e.preventDefault();
      sessionStorage.setItem('erp-demo-auth','1');
      ERPDemo.applyRole(role.value, co.value);
      location.hash='dashboard';
    };
    if(!location.hash) location.hash=sessionStorage.getItem('erp-demo-auth')?'dashboard':'login';
    else route();
  });
})();

</script>
</body>
</html>
