<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ACME ERP · Demo portable</title>
<style>
:root {
  --font: system-ui, 'Segoe UI', sans-serif;
  --mono: ui-monospace, 'Cascadia Mono', monospace;
  --bg: #f0f2f5;
  --bg-soft: #e8ecf1;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --ink: #1a2332;
  --ink-2: #4a5568;
  --ink-3: #718096;
  --border: #d8dee6;
  --border-strong: #b8c2ce;
  /* Fiori/Fusion-inspired enterprise blue — not purple */
  --brand: #0a6ed1;
  --brand-hover: #0854a0;
  --brand-soft: #e8f3fc;
  --brand-ink: #064a8c;
  --accent: #243141;
  --ok: #107e3e;
  --ok-soft: #e3f5ea;
  --warn: #e9730c;
  --warn-soft: #fef3e8;
  --danger: #bb0000;
  --danger-soft: #fce8e8;
  --info: #0a6ed1;
  --info-soft: #e8f3fc;
  --sidebar-w: 260px;
  --header-h: 52px;
  --radius: 4px;
  --shadow: 0 1px 3px rgba(26, 35, 50, 0.08);
  --ease: 180ms ease;
}

[data-theme='dark'] {
  --bg: #0f1419;
  --bg-soft: #161c24;
  --surface: #1a222d;
  --surface-2: #222b38;
  --ink: #e8eef5;
  --ink-2: #a8b5c4;
  --ink-3: #7a8796;
  --border: #2d3848;
  --border-strong: #3d4b5e;
  --brand: #4db1ff;
  --brand-hover: #7ec5ff;
  --brand-soft: rgba(77, 177, 255, 0.12);
  --brand-ink: #b3dbff;
  --ok: #3dd68c;
  --ok-soft: rgba(61, 214, 140, 0.12);
  --warn: #f5a623;
  --warn-soft: rgba(245, 166, 35, 0.12);
  --danger: #ff5c5c;
  --danger-soft: rgba(255, 92, 92, 0.12);
  --info-soft: rgba(77, 177, 255, 0.12);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.45;
}
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }

.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: var(--header-h) 1fr;
  min-height: 100vh;
}
.app.collapsed { grid-template-columns: 64px 1fr; }

.sidebar {
  grid-row: 1 / -1;
  background: var(--accent);
  color: #dce4ee;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: sticky;
  top: 0;
  height: 100vh;
  z-index: 30;
}
.brand {
  height: var(--header-h);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  border-bottom: 1px solid rgba(255,255,255,.08);
  flex-shrink: 0;
}
.brand-mark {
  width: 28px; height: 28px; border-radius: 4px;
  background: var(--brand); color: #fff;
  display: grid; place-items: center;
  font-size: 11px; font-weight: 700;
  flex-shrink: 0;
}
.brand-text { font-size: 13px; font-weight: 600; white-space: nowrap; }
.brand-text span { display: block; font-size: 10px; font-weight: 400; opacity: .65; }
.app.collapsed .brand-text,
.app.collapsed .nav-label,
.app.collapsed .nav-sec { opacity: 0; width: 0; overflow: hidden; }

.nav { flex: 1; overflow-y: auto; padding: 8px; }
.nav-sec {
  font-size: 10px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: rgba(220,228,238,.45);
  padding: 12px 10px 4px; white-space: nowrap;
}
.nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--radius);
  color: rgba(220,228,238,.88); font-size: 13px; font-weight: 500;
  margin-bottom: 1px;
}
.nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav a.active { background: rgba(10,110,209,.35); color: #fff; }
.nav .ico { width: 18px; text-align: center; opacity: .85; flex-shrink: 0; font-size: 13px; }
.nav .badge {
  margin-left: auto; background: #bb0000; color: #fff;
  font-size: 10px; font-weight: 700; min-width: 16px; height: 16px;
  border-radius: 8px; display: grid; place-items: center; padding: 0 4px;
}

.topbar {
  grid-column: 2;
  height: var(--header-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  padding: 0 16px; position: sticky; top: 0; z-index: 20;
}
.icon-btn {
  width: 34px; height: 34px; border: none; border-radius: var(--radius);
  background: transparent; color: var(--ink-2); display: grid; place-items: center;
}
.icon-btn:hover { background: var(--bg-soft); color: var(--ink); }
.search {
  flex: 1; max-width: 420px; position: relative;
}
.search input {
  width: 100%; height: 34px; border: 1px solid var(--border);
  border-radius: var(--radius); background: var(--surface-2);
  padding: 0 10px 0 32px; outline: none;
}
.search input:focus { border-color: var(--brand); background: var(--surface); }
.search .si { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.top-actions { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.user-chip {
  display: flex; align-items: center; gap: 8px;
  padding: 2px 8px 2px 2px; border: 1px solid var(--border);
  border-radius: 20px; background: var(--surface); margin-left: 6px;
}
.avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--brand); color: #fff;
  display: grid; place-items: center; font-size: 11px; font-weight: 700;
}
.user-meta { line-height: 1.15; }
.user-meta strong { display: block; font-size: 12px; }
.user-meta span { font-size: 10px; color: var(--ink-3); }
.dot-alert { position: relative; }
.dot-alert::after {
  content: ''; position: absolute; top: 6px; right: 6px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--danger); border: 2px solid var(--surface);
}

.main { grid-column: 2; padding: 16px 20px 40px; min-width: 0; }
.crumbs {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  font-size: 12px; color: var(--ink-3); margin-bottom: 10px;
}
.crumbs a:hover { color: var(--brand); }
.crumbs .sep { opacity: .5; }

.page-hd {
  display: flex; flex-wrap: wrap; justify-content: space-between;
  align-items: flex-start; gap: 12px; margin-bottom: 16px;
}
.page-hd h1 {
  margin: 0 0 2px; font-size: 22px; font-weight: 700;
  letter-spacing: -.02em;
}
.page-hd p { margin: 0; color: var(--ink-2); font-size: 13px; }
.page-actions { display: flex; flex-wrap: wrap; gap: 8px; }

@media (max-width: 960px) {
  .app, .app.collapsed { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; transform: translateX(-105%);
    width: min(86vw, 280px); transition: transform var(--ease);
  }
  .app.mobile-open .sidebar { transform: none; }
  .topbar, .main { grid-column: 1; }
  .user-meta { display: none; }
}

.login-wrap {
  min-height: 100vh; display: grid; place-items: center;
  background:
    linear-gradient(160deg, #1a2332 0%, #243141 45%, #0a6ed1 140%);
  padding: 24px;
}
.login-card {
  width: min(400px, 100%);
  background: var(--surface);
  border-radius: 8px;
  padding: 28px;
  box-shadow: 0 16px 48px rgba(0,0,0,.25);
}
.login-card h1 { margin: 0 0 4px; font-size: 20px; }
.login-card .sub { margin: 0 0 20px; color: var(--ink-3); font-size: 13px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 12px; border-radius: var(--radius);
  border: 1px solid transparent; font-size: 13px; font-weight: 600;
  background: transparent;
}
.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-hover); }
.btn-secondary { background: var(--surface); border-color: var(--border-strong); color: var(--ink); }
.btn-secondary:hover { background: var(--surface-2); }
.btn-ghost { color: var(--ink-2); }
.btn-ghost:hover { background: var(--bg-soft); }
.btn-danger { background: var(--danger-soft); color: var(--danger); }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }

.kpi-row {
  display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-bottom: 16px;
}
@media (max-width: 1100px) { .kpi-row { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 560px) { .kpi-row { grid-template-columns: 1fr; } }

.kpi {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow);
}
.kpi .l { font-size: 11px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
.kpi .v { font-size: 22px; font-weight: 700; margin-top: 6px; letter-spacing: -.02em; }
.kpi .d { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.kpi .d.up { color: var(--ok); } .kpi .d.down { color: var(--danger); }

.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden;
}
.panel-hd {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2);
}
.panel-hd h2, .panel-hd h3 { margin: 0; font-size: 14px; font-weight: 650; }
.panel-bd { padding: 14px; }

.grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
@media (max-width: 1000px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar .spacer { flex: 1; }

.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.field .req::after { content: ' *'; color: var(--danger); }
.field .hint { font-size: 11px; color: var(--ink-3); }
.control {
  height: 32px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); padding: 0 10px; width: 100%; outline: none;
}
.control:focus { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
textarea.control { height: auto; min-height: 80px; padding: 8px 10px; resize: vertical; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 720px) { .form-grid { grid-template-columns: 1fr; } }

.table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: var(--radius); }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
table.data th {
  text-align: left; padding: 8px 10px; background: var(--surface-2);
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
  color: var(--ink-2); border-bottom: 1px solid var(--border); white-space: nowrap;
}
table.data td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.data tr:hover td { background: var(--brand-soft); }
table.data tr.clickable { cursor: pointer; }

.badge {
  display: inline-flex; align-items: center; height: 20px; padding: 0 7px;
  border-radius: 3px; font-size: 11px; font-weight: 700; white-space: nowrap;
}
.b-ok { background: var(--ok-soft); color: var(--ok); }
.b-warn { background: var(--warn-soft); color: var(--warn); }
.b-danger { background: var(--danger-soft); color: var(--danger); }
.b-info { background: var(--info-soft); color: var(--brand-ink); }
.b-neu { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border); }

.list-row {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.list-row:last-child { border-bottom: none; }

.alert {
  padding: 10px 12px; border-radius: var(--radius); font-size: 13px;
  background: var(--info-soft); color: var(--brand-ink); margin-bottom: 12px;
}
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert.danger { background: var(--danger-soft); color: var(--danger); }

.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 14px; overflow-x: auto; }
.tab {
  border: none; background: transparent; padding: 8px 14px;
  font-weight: 600; font-size: 13px; color: var(--ink-3);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab.active { color: var(--brand-ink); border-bottom-color: var(--brand); }

.timeline { position: relative; padding-left: 18px; }
.timeline::before {
  content: ''; position: absolute; left: 4px; top: 4px; bottom: 4px;
  width: 2px; background: var(--border-strong);
}
.tl { position: relative; padding: 0 0 14px 8px; }
.tl:last-child { padding-bottom: 0; }
.tl::before {
  content: ''; position: absolute; left: -18px; top: 3px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--brand);
}
.tl.done::before { background: var(--brand); }
.tl h4 { margin: 0 0 2px; font-size: 13px; }
.tl p, .tl time { margin: 0; font-size: 12px; color: var(--ink-3); }

.toast-host { position: fixed; right: 16px; bottom: 16px; z-index: 80; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--ink); color: var(--bg); padding: 10px 14px;
  border-radius: var(--radius); font-size: 13px; min-width: 220px;
}
[data-theme='dark'] .toast { background: #e8eef5; color: #0f1419; }

.chip {
  display: inline-flex; height: 22px; padding: 0 8px; border-radius: 11px;
  background: var(--brand-soft); color: var(--brand-ink); font-size: 11px; font-weight: 650;
}
.progress { height: 6px; border-radius: 3px; background: var(--bg-soft); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--brand); }

.empty { text-align: center; padding: 32px; color: var(--ink-3); }
.footer-note { font-size: 11px; color: var(--ink-3); margin-top: 20px; text-align: center; }

.login-wrap { display:grid; }
</style>
</head>

const BASE = '';
function money(n){ return ERPDemo.money(n); }
function badge(s){ return ERPDemo.badge(s); }
function crumbs(items){
  return `<nav class="crumbs">${items.map((c,i)=> i<items.length-1
    ? `<a href="#${c.href}">${c.label}</a><span class="sep">/</span>`
    : `<span>${c.label}</span>`).join('')}</nav>`;
}
function pageHead(title, sub, actions=''){
  return `<div class="page-hd"><div><h1>${title}</h1><p>${sub||''}</p></div><div class="page-actions">${actions||''}</div></div>`;
}
function table(headers, rows){
  return `<div class="table-wrap"><table class="data"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function formGrid(fields){ return `<div class="panel"><div class="panel-bd"><div class="form-grid">${fields}</div></div></div>`; }
function field(label, ctrl, req=false, full=false){
  return `<div class="field${full?' full':''}"><label${req?' class="req"':''}>${label}</label>${ctrl}</div>`;
}

// dynamic detail routes
function renderDetail(kind, id){
  const D=ERPDemo;
  if(kind==='detalle-oc'){
    const p=D.pos.find(x=>x.id===id)||D.pos[0];
    return crumbs([{label:'Órdenes',href:'ordenes'},{label:p.id}])+
      pageHead(p.id, money(p.total_amount), `<a class="btn btn-primary btn-sm" href="#bandeja">Aprobar</a>`)+
      `<div class="panel"><div class="panel-bd form-grid">
        <div class="field"><label>vendor_id</label><div>${p.vendor_id}</div></div>
        <div class="field"><label>status</label><div>${badge(p.status)}</div></div>
        <div class="field"><label>order_date</label><div>${p.order_date}</div></div>
        <div class="field"><label>payment_terms</label><div>${p.payment_terms}</div></div>
        <div class="field full"><label>delivery_address</label><div>${p.delivery_address}</div></div>
      </div></div>`;
  }
  if(kind==='detalle-pr'){
    const p=D.prs.find(x=>x.id===id)||D.prs[0];
    return crumbs([{label:'Requisiciones',href:'requisiciones'},{label:p.id}])+
      pageHead(p.title, p.id)+
      `<div class="panel"><div class="panel-bd form-grid">
        <div class="field"><label>status</label><div>${badge(p.status)}</div></div>
        <div class="field"><label>total_amount</label><div>${money(p.total_amount)}</div></div>
        <div class="field full"><label>justification</label><div>${p.justification}</div></div>
      </div></div>`;
  }
  if(kind==='detalle-ap'){
    const i=D.apInvoices.find(x=>x.id===id)||D.apInvoices[0];
    return crumbs([{label:'AP',href:'facturas-ap'},{label:i.id}])+
      pageHead(i.id, money(i.grand_total), `<a class="btn btn-primary btn-sm" href="#pagos-ap">Programar pago</a>`)+
      `<div class="panel"><div class="panel-bd form-grid">
        <div class="field"><label>vendor_id</label><div>${i.vendor_id}</div></div>
        <div class="field"><label>status</label><div>${badge(i.status)}</div></div>
        <div class="field"><label>match_status</label><div>${i.match_status}</div></div>
        <div class="field"><label>due_date</label><div>${i.due_date}</div></div>
      </div></div>`;
  }
  if(kind==='detalle-so'){
    const s=D.salesOrders.find(x=>x.id===id)||D.salesOrders[0];
    return crumbs([{label:'Ventas',href:'ventas'},{label:s.id}])+
      pageHead(s.id, money(s.total_amount), `<a class="btn btn-primary btn-sm" href="#billing">Facturar</a>`)+
      `<div class="panel"><div class="panel-bd form-grid">
        <div class="field"><label>customer_id</label><div>${s.customer_id}</div></div>
        <div class="field"><label>status</label><div>${badge(s.status)}</div></div>
      </div></div>`;
  }
  return pageHead('No encontrado','');
}

window.decide=(id,decision)=>{
  const c=document.getElementById('c-'+id)?.value?.trim()||'';
  if(decision==='REJECT'&&c.length<5){toast('comment obligatorio en REJECT');return;}
  toast(id+' · '+decision);
};
window.toast=(msg)=>{
  let host=document.getElementById('toast-host');
  if(!host){host=document.createElement('div');host.id='toast-host';host.className='toast-host';document.body.appendChild(host);}
  const el=document.createElement('div');el.className='toast';el.textContent=msg;host.appendChild(el);
  setTimeout(()=>el.remove(),2800);
};


function go(route){
  if(!route) return;
  if(route.charAt(0)==='#') route=route.slice(1);
  location.hash = route;
}
document.addEventListener('click', function(e){
  const a = e.target.closest('[data-go], a[href^="#"]');
  if(!a) return;
  const route = a.getAttribute('data-go') || (a.getAttribute('href')||'').replace(/^#/,'');
  if(!route) return;
  e.preventDefault();
  e.stopPropagation();
  go(route);
}, true);

const NAV=[
  {sec:'Inicio',items:[{h:'dashboard',l:'Dashboard',i:'▣'}]},
  {sec:'Operación',items:[{h:'compras',l:'Compras',i:'◇'},{h:'ventas',l:'Ventas',i:'▤'},{h:'inventarios',l:'Inventarios',i:'▦'}]},
  {sec:'Finanzas',items:[{h:'finanzas',l:'Finanzas',i:'◈'},{h:'activos',l:'Activos',i:'▣'},{h:'proyectos',l:'Proyectos',i:'◎'}]},
  {sec:'Personas',items:[{h:'rh',l:'RRHH',i:'♟'},{h:'nomina',l:'Nómina',i:'₮'}]},
  {sec:'Plataforma',items:[{h:'bandeja',l:'Bandeja',i:'⟳',b:3},{h:'admin',l:'Administración',i:'⬡'},{h:'reportes',l:'Reportes',i:'▥'}]}
];

function buildShell(){
  const s=ERPDemo.session;
  const route=(location.hash.slice(1)||'dashboard').split('/')[0];
  document.getElementById('sidebar').innerHTML=`
    <div class="brand"><div class="brand-mark">ERP</div><div class="brand-text">ACME Industrial<span>Portable · datos demo</span></div></div>
    <nav class="nav">${NAV.map(sec=>`<div class="nav-sec">${sec.sec}</div>${sec.items.map(it=>`
      <a class="${route===it.h||(route.startsWith(it.h.split('-')[0])&&it.h==='finanzas'&&false)?'':''} ${['dashboard','compras','ventas','inventarios','finanzas','activos','proyectos','rh','nomina','bandeja','admin','reportes'].includes(route)&&route===it.h?'active':''}" href="#${it.h}">
        <span class="ico">${it.i}</span><span class="nav-label">${it.l}</span>${it.b?`<span class="badge">${it.b}</span>`:''}
      </a>`).join('')}`).join('')}</nav>`;
  // better active: match top-level module
  document.querySelectorAll('#sidebar .nav a').forEach(a=>{
    const h=a.getAttribute('href').slice(1);
    a.classList.toggle('active', route===h || (route.startsWith(h) && h.length>3));
  });
  document.getElementById('topbar').innerHTML=`
    <button class="icon-btn" id="btn-side" type="button">☰</button>
    <div class="search"><span class="si">⌕</span><input id="q" placeholder="Buscar PO, AP, SO…"/></div>
    <div class="top-actions">
      <button class="icon-btn" id="btn-theme" type="button">◐</button>
      <button class="icon-btn dot-alert" type="button" onclick="location.hash='notificaciones'">🔔</button>
      <button class="user-chip" type="button" onclick="location.hash='perfil'">
        <div class="avatar">${s.short}</div>
        <div class="user-meta"><strong>${s.display_name}</strong><span>${s.role}</span></div>
      </button>
      <button class="icon-btn" id="btn-out" type="button">⎋</button>
    </div>`;
  document.getElementById('btn-side').onclick=()=>{
    const app=document.getElementById('app');
    if(matchMedia('(max-width:960px)').matches) app.classList.toggle('mobile-open');
    else app.classList.toggle('collapsed');
  };
  document.getElementById('btn-theme').onclick=()=>{
    const next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
  };
  document.getElementById('btn-out').onclick=()=>{
    sessionStorage.removeItem('erp-portable-auth');
    location.hash='login';
  };
}

function route(){
  const raw=location.hash.slice(1)||'login';
  const [name,id]=raw.split('/');
  if(name!=='login' && !sessionStorage.getItem('erp-portable-auth')){
    location.hash='login'; return;
  }
  if(name==='login'){
    document.getElementById('app').style.display='none';
    document.getElementById('login-root').style.display='grid';
    return;
  }
  document.getElementById('login-root').style.display='none';
  document.getElementById('app').style.display='grid';
  buildShell();
  let html;
  if(id && name.startsWith('detalle')) html=renderDetail(name,id);
  else if(VIEWS[name]) html=VIEWS[name]();
  else html=pageHead('Pantalla no encontrada', name)+`<a class="btn btn-secondary" href="#dashboard">Dashboard</a>`;
  document.getElementById('content').innerHTML=html+`<p class="footer-note">ERP Portable · ERP-SI-001 / ERP-FM-001 · sin backend · datos ACME simulados</p>`;
}

window.addEventListener('hashchange', route);
document.addEventListener('DOMContentLoaded', ()=>{
  // raw.githubusercontent sirve text/plain → se ve el código fuente
  if (/raw\.githubusercontent\.com/i.test(location.host)) {
    document.body.innerHTML = '<div style="font:16px system-ui;padding:32px;max-width:560px;margin:auto">'
      + '<h1>Este enlace muestra el código, no la demo</h1>'
      + '<p>Abre uno de estos:</p><ol>'
      + '<li><a href="https://raw.githack.com/arath-devops/Timbrado/feat-ERP/erp-grp-platform/erp-preview/portable.html">raw.githack.com (recomendado)</a></li>'
      + '<li>Descarga el archivo y ábrelo con doble clic en tu navegador</li>'
      + '</ol></div>';
    return;
  }
  document.getElementById('login-form').onsubmit=(e)=>{
    e.preventDefault();
    sessionStorage.setItem('erp-portable-auth','1');
    location.hash='dashboard';
  };
  if(!location.hash) location.hash = sessionStorage.getItem('erp-portable-auth') ? 'dashboard' : 'login';
  else route();
});
