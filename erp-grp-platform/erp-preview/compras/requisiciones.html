<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Requisiciones · ERP Preview</title>
<link rel="stylesheet" href="../assets/css/tokens.css"/>
<link rel="stylesheet" href="../assets/css/shell.css"/>
<link rel="stylesheet" href="../assets/css/components.css"/>
</head><body data-depth="..">
<div class="app" id="app"><main class="main" id="main"><div id="content"></div>
<p class="footer-note">ERP Preview · P0 UX · ERP-SI/FM · sin backend</p></main></div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const D=ERPDemo; D.restoreSession();
  const el=document.getElementById('content');
  el.innerHTML = 
crumbs([{label:'Compras',href:'index.html'},{label:'Requisiciones'}])+
pageHead('Mis requisiciones','',`<a class="btn btn-primary btn-sm" href="nueva-requisicion.html">Nueva</a>`)+
`<div class="table-wrap"><table class="data"><thead><tr><th>id</th><th>${L('title')}</th><th>${L('requester_id')}</th><th>${L('org_unit_id')}</th><th>${L('need_by_date')}</th><th>${L('total_amount')}</th><th>${L('status')}</th></tr></thead>
<tbody>${D.prs.map(p=>`<tr class="clickable" onclick="location.href='detalle-pr.html?id=${p.id}'"><td><strong>${p.id}</strong></td><td>${p.title}</td><td>${p.requester_id}</td><td>${p.org_unit_id}</td><td>${p.need_by_date||'—'}</td><td>${D.money(p.total_amount)}</td><td>${statusChip(p.status)}</td></tr>`).join('')}</tbody></table></div>
;
  
});
</script></body></html>
