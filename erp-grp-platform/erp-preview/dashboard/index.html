<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dashboard · ERP Preview</title>
<link rel="stylesheet" href="../assets/css/tokens.css"/>
<link rel="stylesheet" href="../assets/css/shell.css"/>
<link rel="stylesheet" href="../assets/css/components.css"/>
</head><body data-depth="..">
<div class="app" id="app"><main class="main" id="main"><div id="content"></div>
<p class="footer-note">ERP Preview · P0 UX · ERP-SI/FM · sin backend</p></main></div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const D=ERPDemo; D.restoreSession();
  const el=document.getElementById('content');
  el.innerHTML = 
(()=>{
  const kpis=D.kpisForRole();
  const s=D.session;
  const isExec = s.role_id==='DG'||s.role_id==='CFO';
  return crumbs([{label:'Inicio'},{label:'Dashboard'}])+
  pageHead('Dashboard · '+s.role, s.company+' · '+s.legal_entity,
    `<a class="btn btn-secondary btn-sm" href="../administracion/bandeja.html">Bandeja (${D.tasks.length})</a>`)+
  `<div class="kpi-row">${kpis.map(k=>`<div class="kpi"><div class="l">${k.l}</div><div class="v">${k.v}</div><div class="d ${k.t}">${k.d}</div></div>`).join('')}</div>`+
  (isExec
    ? `<div class="grid-2">
        <div class="panel"><div class="panel-hd"><h3>Inbox ejecutivo</h3></div><div class="panel-bd">
          ${D.tasks.map(t=>`<div class="list-row"><div style="flex:1"><strong>${t.task_id}</strong> · ${t.ref}<div style="font-size:12px;color:var(--ink-3)">${t.title}<br/>Por qué: ${t.why||'—'}</div></div>
          <div>${D.money(t.amount)}</div></div>`).join('')}
        </div></div>
        <div class="panel"><div class="panel-hd"><h3>Señales</h3></div><div class="panel-bd">
          <div class="alert warn">Periodo 2026-11 OPEN</div>
          <div class="alert danger">Cliente C-2030 con crédito bloqueado</div>
          <div class="alert">CxP abierto ${D.money(253400)} · CxC ${D.money(401250)}</div>
        </div></div>
      </div>`
    : `<div class="grid-2">
        <div class="panel"><div class="panel-hd"><h3>Mis tareas</h3></div><div class="panel-bd">
          ${D.tasks.map(t=>`<div class="list-row"><div style="flex:1"><strong>${t.ref}</strong><div style="font-size:12px;color:var(--ink-3)">${t.title}</div></div><div>${D.money(t.amount)}</div></div>`).join('')}
        </div></div>
        <div class="panel"><div class="panel-hd"><h3>Accesos del rol</h3></div><div class="panel-bd" style="display:flex;flex-wrap:wrap;gap:8px">
          ${s.nav.slice(0,8).map(k=>`<span class="chip">${k}</span>`).join('')}
        </div></div>
      </div>`)+
  `<div class="panel"><div class="panel-hd"><h3>Accesos rápidos</h3></div><div class="panel-bd" style="display:flex;flex-wrap:wrap;gap:8px">
    ${[['CxP','../finanzas/cxp.html'],['Facturación','../finanzas/facturacion.html'],['CxC','../finanzas/cxc.html'],['Compras','../compras/index.html'],['Ventas','../ventas/index.html'],['Inventarios','../inventarios/index.html'],['Recepción (INV)','../inventarios/recepcion-inv.html']].map(([l,h])=>`<a class="btn btn-secondary btn-sm" href="${h}">${l}</a>`).join('')}
  </div></div>`;
})()
;
  
});
</script></body></html>
