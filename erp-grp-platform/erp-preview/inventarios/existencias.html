<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Existencias · ERP Preview</title>
<link rel="stylesheet" href="../assets/css/tokens.css"/>
<link rel="stylesheet" href="../assets/css/shell.css"/>
<link rel="stylesheet" href="../assets/css/components.css"/>
</head><body data-depth="..">
<div class="app" id="app"><main class="main" id="main"><div id="content"></div>
<p class="footer-note">ERP Preview · ERP-SI-001 / ERP-FM-001 · sin backend</p></main></div>
<script src="../assets/js/data.js"></script><script src="../assets/js/shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const D=ERPDemo;
  document.getElementById('content').innerHTML = 
crumbs([{label:'Inventarios',href:'index.html'},{label:'Existencias'}])+
pageHead('Consulta de existencias', 'Filtros warehouse_id / item_id', '')+
`<div class="toolbar">
  <select class="control" style="max-width:160px"><option value="">warehouse_id</option><option>WH-P1</option><option>WH-FG</option></select>
  <select class="control" style="max-width:180px"><option value="">item_id</option>${D.items.map(i=>`<option>${i.item_code}</option>`).join('')}</select>
</div>
<div class="table-wrap"><table class="data"><thead><tr><th>item_code</th><th>warehouse_id</th><th>qty</th></tr></thead>
<tbody>${D.stock.map(s=>`<tr><td>${s.item_code}</td><td>${s.warehouse_id}</td><td>${s.qty.toLocaleString('es-MX')}</td></tr>`).join('')}</tbody></table></div>
;
  
});
</script></body></html>
