<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ERP Preview · Ingresar</title>
  <link rel="stylesheet" href="assets/css/tokens.css"/>
  <link rel="stylesheet" href="assets/css/components.css"/>
  <link rel="stylesheet" href="assets/css/shell.css"/>
</head>
<body data-public="1">
  <div class="login-wrap">
    <form class="login-card" id="login">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
        <div class="brand-mark" style="width:36px;height:36px;border-radius:6px;background:#0a6ed1;color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px">ERP</div>
        <div><strong>ACME Industrial</strong><div style="font-size:12px;color:var(--ink-3)">ERP Preview Kit · sin backend</div></div>
      </div>
      <h1>Iniciar sesión</h1>
      <p class="sub">Campos ERP-FM-001 · tenant_or_company, username, password</p>
      <div class="field"><label class="req">tenant_or_company</label>
        <select class="control" name="tenant_or_company">
          <option>ACME Industrial S.A. de C.V.</option>
        </select>
      </div>
      <div class="field"><label class="req">username</label>
        <input class="control" name="username" value="mhernandez" autocomplete="username"/>
      </div>
      <div class="field"><label class="req">password</label>
        <input class="control" name="password" type="password" value="demo1234" autocomplete="current-password"/>
        <span class="hint">Demo: cualquier password admite ingreso</span>
      </div>
      <button class="btn btn-primary" style="width:100%;height:36px;margin-top:8px" type="submit">Entrar</button>
      <p style="margin:14px 0 0;font-size:11px;color:var(--ink-3);text-align:center">Pantallas y campos solo de ERP-SI-001 / ERP-FM-001</p>
    </form>
  </div>
  <script>
    document.getElementById('login').onsubmit = (e) => {
      e.preventDefault();
      sessionStorage.setItem('erp-demo-auth', '1');
      location.href = 'dashboard/index.html';
    };
  </script>
</body>
</html>
