<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Timesheets · ERP Preview</title>
<link rel="stylesheet" href="../assets/css/tokens.css"/>
<link rel="stylesheet" href="../assets/css/shell.css"/>
<link rel="stylesheet" href="../assets/css/components.css"/>
</head><body data-depth="..">
<div class="app" id="app"><main class="main" id="main"><div id="content"></div>
<p class="footer-note">ERP Preview · ERP-SI-001 / ERP-FM-001 · sin backend</p></main></div>
<script src="../assets/js/data.js"></script><script src="../assets/js/shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const D=ERPDemo;
  document.getElementById('content').innerHTML = 
crumbs([{label:'Proyectos',href:'index.html'},{label:'Timesheets'}])+
pageHead('Timesheets', 'project_id, work_date, hours',
  `<button class="btn btn-primary btn-sm" onclick="toast('Timesheet guardado')">Guardar</button>`)+
`<div class="panel"><div class="panel-bd"><div class="form-grid">
  <div class="field"><label class="req">project_id</label><select class="control">${D.projects.map(p=>`<option>${p.project_code}</option>`).join('')}</select></div>
  <div class="field"><label class="req">work_date</label><input class="control" type="date" value="2026-11-06"/></div>
  <div class="field"><label class="req">hours</label><input class="control" type="number" step="0.25" value="8"/></div>
  <div class="field"><label>task_id</label><input class="control" placeholder="WBS opcional"/></div>
</div></div></div>
;
  
});
</script></body></html>
