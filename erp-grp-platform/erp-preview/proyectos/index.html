<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Proyectos · ERP Preview</title>
<link rel="stylesheet" href="../assets/css/tokens.css"/>
<link rel="stylesheet" href="../assets/css/shell.css"/>
<link rel="stylesheet" href="../assets/css/components.css"/>
</head><body data-depth="..">
<div class="app" id="app"><main class="main" id="main"><div id="content"></div>
<p class="footer-note">ERP Preview · ERP-SI-001 / ERP-FM-001 · sin backend</p></main></div>
<script src="../assets/js/data.js"></script><script src="../assets/js/shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const D=ERPDemo;
  document.getElementById('content').innerHTML = 
crumbs([{label:'Finanzas'},{label:'Proyectos'}])+
pageHead('Proyectos', 'Lista / plan · Timesheets',
  `<a class="btn btn-secondary btn-sm" href="timesheets.html">Timesheets</a>`)+
`<div class="table-wrap"><table class="data"><thead><tr><th>project_code</th><th>project_name</th><th>customer_id</th><th>start_date</th><th>end_date</th><th>budget_amount</th><th>status</th></tr></thead>
<tbody>${D.projects.map(p=>`<tr><td><strong>${p.project_code}</strong></td><td>${p.project_name}</td><td>${p.customer_id||'—'}</td><td>${p.start_date}</td><td>${p.end_date||'—'}</td><td>${D.money(p.budget_amount)}</td><td>${D.badge(p.status)}</td></tr>`).join('')}</tbody></table></div>
;
  
});
</script></body></html>
