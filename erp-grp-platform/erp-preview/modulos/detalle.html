<script>
document.addEventListener('DOMContentLoaded', () => {
  ERPDemo.restoreSession();
  const id = new URLSearchParams(location.search).get('m') || 'compras';
  const mod = ERPModules.byId(id);
  document.title = (mod ? mod.name : 'Módulo') + ' · Atlas ERP';
  document.getElementById('content').innerHTML = renderModuleDetail(mod);
});
</script></body></html>
