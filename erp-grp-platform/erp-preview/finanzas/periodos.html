<link rel="stylesheet" href="../assets/css/tokens.css"/>

</head><body data-depth="..">

<script>
document.addEventListener('DOMContentLoaded',()=>{
  const D=ERPDemo;
  document.getElementById('content').innerHTML = 
crumbs([{label:'Finanzas',href:'index.html'},{label:'Periodos'}])+
pageHead('Periodos contables', 'OPEN / SOFT_CLOSE / HARD_CLOSE', '')+
`<div class="table-wrap"><table class="data"><thead><tr><th>fiscal_year</th><th>period_id</th><th>start_date</th><th>end_date</th><th>status</th></tr></thead>
<tbody>${D.periods.map(p=>`<tr><td>${p.fiscal_year}</td><td><strong>${p.period_id}</strong></td><td>${p.start_date}</td><td>${p.end_date}</td><td>${D.badge(p.status)}</td></tr>`).join('')}</tbody></table></div>
;
  
});
