<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Captura AP · ERP Preview</title>
<link rel="stylesheet" href="../assets/css/tokens.css"/>
<link rel="stylesheet" href="../assets/css/shell.css"/>
<link rel="stylesheet" href="../assets/css/components.css"/>
</head><body data-depth="..">
<div class="app" id="app"><main class="main" id="main"><div id="content"></div>
<p class="footer-note">ERP Preview · ERP-SI-001 / ERP-FM-001 · sin backend</p></main></div>
<script src="../assets/js/data.js"></script><script src="../assets/js/shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const D=ERPDemo;
  document.getElementById('content').innerHTML = 
crumbs([{label:'AP',href:'facturas-ap.html'},{label:'Captura'}])+
pageHead('Captura factura proveedor', 'Unique (vendor, invoice_number) · periodo OPEN',
  `<button class="btn btn-primary btn-sm" onclick="toast('AP invoice DRAFT/PENDING_APPROVAL simulado');location.href='facturas-ap.html'">Guardar</button>`)+
`<div class="panel"><div class="panel-bd"><div class="form-grid">
  <div class="field"><label class="req">vendor_id</label><select class="control">${D.vendors.map(v=>`<option>${v.vendor_code}</option>`).join('')}</select></div>
  <div class="field"><label class="req">invoice_number</label><input class="control" placeholder="único por vendor"/></div>
  <div class="field"><label class="req">invoice_date</label><input class="control" type="date" value="2026-11-07"/></div>
  <div class="field"><label class="req">posting_date</label><input class="control" type="date" value="2026-11-07"/></div>
  <div class="field"><label class="req">currency</label><input class="control" value="MXN"/></div>
  <div class="field"><label>po_id</label><select class="control"><option value="">—</option>${D.pos.map(p=>`<option>${p.id}</option>`).join('')}</select></div>
  <div class="field"><label>gr_id</label><input class="control" placeholder="condicional 3-way"/></div>
  <div class="field"><label class="req">line_item</label><input class="control"/></div>
  <div class="field"><label>line_qty</label><input class="control" type="number" value="1"/></div>
  <div class="field"><label class="req">line_unit_price</label><input class="control" type="number"/></div>
  <div class="field"><label class="req">line_tax_code</label><input class="control" value="IVA16"/></div>
  <div class="field"><label class="req">subtotal</label><input class="control" type="number"/></div>
  <div class="field"><label class="req">tax_total</label><input class="control" type="number"/></div>
  <div class="field"><label class="req">grand_total</label><input class="control" type="number"/></div>
  <div class="field"><label class="req">due_date</label><input class="control" type="date"/></div>
  <div class="field"><label>cfdi_uuid</label><input class="control" placeholder="condicional MX Pro"/><span class="hint">UUID v4</span></div>
</div></div></div>
;
  
});
</script></body></html>
