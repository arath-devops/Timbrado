<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CxC · ERP Preview</title>
<link rel="stylesheet" href="../assets/css/tokens.css"/>
<link rel="stylesheet" href="../assets/css/shell.css"/>
<link rel="stylesheet" href="../assets/css/components.css"/>
</head><body data-depth="..">
<div class="app" id="app"><main class="main" id="main"><div id="content"></div>
<p class="footer-note">ERP Preview · ERP-SI-001 / ERP-FM-001 · sin backend</p></main></div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const D=ERPDemo;
  document.getElementById('content').innerHTML = 
crumbs([{label:'Finanzas',href:'index.html'},{label:'CxC · Cuentas por cobrar'}])+
pageHead('Cuentas por cobrar (CxC)', 'Facturas cliente · cobros · aging · estado de cuenta',
  `<a class="btn btn-primary btn-sm" href="cobros.html">Registrar cobro</a>
   <a class="btn btn-secondary btn-sm" href="facturas-ar.html">Facturas cliente</a>`)+
`<div class="kpi-row">
  <div class="kpi"><div class="l">Saldo abierto</div><div class="v">${D.money(D.arInvoices.reduce((s,i)=>s+i.open_amount,0))}</div></div>
  <div class="kpi"><div class="l">Facturas</div><div class="v">${D.arInvoices.length}</div></div>
  <div class="kpi"><div class="l">Parcialmente pagadas</div><div class="v">${D.arInvoices.filter(i=>i.status==='PARTIALLY_PAID').length}</div></div>
  <div class="kpi"><div class="l">Clientes</div><div class="v">${D.customers.length}</div></div>
</div>
<div class="panel"><div class="panel-hd"><h3>Procesos CxC (SI-001)</h3></div><div class="panel-bd" style="display:flex;flex-wrap:wrap;gap:8px">
  <a class="btn btn-secondary btn-sm" href="facturas-ar.html">Lista de facturas de cliente</a>
  <a class="btn btn-secondary btn-sm" href="cobros.html">Registro de cobros</a>
  <a class="btn btn-secondary btn-sm" href="aging-ar.html">Antigüedad de saldos</a>
  <a class="btn btn-secondary btn-sm" href="estado-cuenta.html">Estado de cuenta</a>
  <a class="btn btn-secondary btn-sm" href="facturacion.html">Ir a Facturación</a>
</div></div>
<div class="panel"><div class="panel-hd"><h3>Cartera</h3></div><div class="panel-bd">
<div class="table-wrap"><table class="data"><thead><tr><th>id</th><th>customer_id</th><th>invoice_date</th><th>grand_total</th><th>open_amount</th><th>status</th></tr></thead>
<tbody>${D.arInvoices.map(i=>`<tr><td><strong>${i.id}</strong></td><td>${i.customer_id}</td><td>${i.invoice_date}</td><td>${D.money(i.grand_total)}</td><td>${D.money(i.open_amount)}</td><td>${D.badge(i.status)}</td></tr>`).join('')}</tbody></table></div>
</div></div>
;
});
</script></body></html>
