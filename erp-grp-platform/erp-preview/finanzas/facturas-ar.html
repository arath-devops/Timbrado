<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Facturas AR · ERP Preview</title>
<link rel="stylesheet" href="../assets/css/tokens.css"/>
<link rel="stylesheet" href="../assets/css/shell.css"/>
<link rel="stylesheet" href="../assets/css/components.css"/>
</head><body data-depth="..">
<div class="app" id="app"><main class="main" id="main"><div id="content"></div>
<p class="footer-note">ERP Preview · ERP-SI-001 / ERP-FM-001 · sin backend</p></main></div>
<script src="../assets/js/data.js"></script><script src="../assets/js/shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const D=ERPDemo;
  document.getElementById('content').innerHTML = 
crumbs([{label:'Finanzas',href:'index.html'},{label:'AR'}])+
pageHead('Lista de facturas de cliente', '',
  `<a class="btn btn-primary btn-sm" href="emitir-factura.html">Emisión factura</a>
   <a class="btn btn-secondary btn-sm" href="cobros.html">Registro de cobros</a>`)+
`<div class="table-wrap"><table class="data"><thead><tr><th>id</th><th>customer_id</th><th>invoice_date</th><th>sales_order_id</th><th>payment_terms</th><th>grand_total</th><th>open_amount</th><th>status</th></tr></thead>
<tbody>${D.arInvoices.map(i=>`<tr><td><strong>${i.id}</strong></td><td>${i.customer_id}</td><td>${i.invoice_date}</td><td>${i.sales_order_id}</td><td>${i.payment_terms}</td><td>${D.money(i.grand_total)}</td><td>${D.money(i.open_amount)}</td><td>${D.badge(i.status)}</td></tr>`).join('')}</tbody></table></div>
<p style="margin-top:10px"><a href="aging-ar.html">Antigüedad AR</a> · <a href="estado-cuenta.html">Estado de cuenta cliente</a></p>
;
  
});
</script></body></html>
