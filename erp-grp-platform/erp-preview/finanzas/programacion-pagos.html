<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Programación pagos · ERP Preview</title>
<link rel="stylesheet" href="../assets/css/tokens.css"/>
<link rel="stylesheet" href="../assets/css/shell.css"/>
<link rel="stylesheet" href="../assets/css/components.css"/>
</head><body data-depth="..">
<div class="app" id="app"><main class="main" id="main"><div id="content"></div>
<p class="footer-note">ERP Preview · ERP-SI-001 / ERP-FM-001 · sin backend</p></main></div>
<script src="../assets/js/data.js"></script><script src="../assets/js/shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const D=ERPDemo;
  document.getElementById('content').innerHTML = 
crumbs([{label:'AP',href:'facturas-ap.html'},{label:'Programación de pagos'}])+
pageHead('Programación de pagos', 'Solo POSTED con saldo · payment_amount ≤ open',
  `<button class="btn btn-primary btn-sm" onclick="toast('Payment proposal DRAFT · puede requerir WF')">Crear propuesta</button>`)+
`<div class="panel"><div class="panel-bd"><div class="form-grid">
  <div class="field full"><label class="req">invoice_ids</label>
    <div>${D.apInvoices.filter(i=>i.status==='POSTED').map(i=>`<label style="display:flex;gap:8px;margin:4px 0"><input type="checkbox" checked/> ${i.id} · ${D.money(i.grand_total)}</label>`).join('')}</div>
  </div>
  <div class="field"><label class="req">payment_date</label><input class="control" type="date" value="2026-11-10"/></div>
  <div class="field"><label class="req">bank_account_id</label><select class="control">${D.banks.map((b,i)=>`<option>BANK-${i+1} ${b.bank_name}</option>`).join('')}</select></div>
  <div class="field"><label class="req">payment_amount</label><input class="control" type="number" value="128400"/></div>
  <div class="field"><label class="req">payment_method</label><select class="control"><option>TRANSFER</option><option>CHECK</option><option>CASH</option></select></div>
</div></div></div>
;
  
});
</script></body></html>
