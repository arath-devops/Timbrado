<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Billing · ERP Preview</title>
<link rel="stylesheet" href="../assets/css/tokens.css"/>
<link rel="stylesheet" href="../assets/css/shell.css"/>
<link rel="stylesheet" href="../assets/css/components.css"/>
</head><body data-depth="..">
<div class="app" id="app"><main class="main" id="main"><div id="content"></div>
<p class="footer-note">ERP Preview · ERP-SI-001 / ERP-FM-001 · sin backend</p></main></div>
<script src="../assets/js/data.js"></script><script src="../assets/js/shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const D=ERPDemo;
  document.getElementById('content').innerHTML = 
crumbs([{label:'AR',href:'facturas-ar.html'},{label:'Emisión'}])+
pageHead('Emisión de factura / CFDI', 'FM §4.1 Billing',
  `<button class="btn btn-primary btn-sm" onclick="toast('AR Invoice ISSUED (simulado)');location.href='facturas-ar.html'">Emitir</button>`)+
`<div class="panel"><div class="panel-bd"><div class="form-grid">
  <div class="field"><label class="req">customer_id</label><select class="control">${D.customers.map(c=>`<option value="${c.code}">${c.code} — ${c.name}</option>`).join('')}</select></div>
  <div class="field"><label class="req">invoice_date</label><input class="control" type="date" value="2026-11-07"/></div>
  <div class="field"><label>sales_order_id</label><select class="control"><option value="">—</option>${D.salesOrders.map(s=>`<option>${s.id}</option>`).join('')}</select></div>
  <div class="field"><label class="req">payment_terms</label><input class="control" value="NET30"/></div>
  <div class="field"><label class="req">line_product</label><select class="control">${D.items.map(i=>`<option>${i.item_code}</option>`).join('')}</select></div>
  <div class="field"><label class="req">line_qty</label><input class="control" type="number" value="10"/></div>
  <div class="field"><label class="req">line_price</label><input class="control" type="number" value="8450"/></div>
  <div class="field"><label class="req">tax_code</label><input class="control" value="IVA16"/></div>
  <div class="field"><label class="req">grand_total</label><input class="control" value="98020" readonly/></div>
  <div class="field"><label>cfdi_usage</label><input class="control" placeholder="condicional MX"/></div>
</div></div></div>
;
  
});
</script></body></html>
