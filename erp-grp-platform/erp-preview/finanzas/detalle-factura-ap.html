<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Detalle AP · ERP Preview</title>
<link rel="stylesheet" href="../assets/css/tokens.css"/>
<link rel="stylesheet" href="../assets/css/shell.css"/>
<link rel="stylesheet" href="../assets/css/components.css"/>
</head><body data-depth="..">
<div class="app" id="app"><main class="main" id="main"><div id="content"></div>
<p class="footer-note">ERP Preview · ERP-SI-001 / ERP-FM-001 · sin backend</p></main></div>
<script src="../assets/js/data.js"></script><script src="../assets/js/shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const D=ERPDemo;
  document.getElementById('content').innerHTML = 
(()=>{const id=new URLSearchParams(location.search).get('id')||'AP-88421';
const i=D.apInvoices.find(x=>x.id===id)||D.apInvoices[0];
return crumbs([{label:'AP',href:'facturas-ap.html'},{label:i.id}])+
pageHead(i.id, i.invoice_number+' · '+D.money(i.grand_total),
  `<a class="btn btn-primary btn-sm" href="programacion-pagos.html">Programar pago</a>`)+
`<div class="panel"><div class="panel-bd form-grid">
  <div class="field"><label>vendor_id</label><div>${i.vendor_id}</div></div>
  <div class="field"><label>status</label><div>${D.badge(i.status)}</div></div>
  <div class="field"><label>po_id / gr_id</label><div>${i.po_id||'—'} / ${i.gr_id||'—'}</div></div>
  <div class="field"><label>match_status</label><div>${i.match_status}</div></div>
  <div class="field"><label>subtotal</label><div>${D.money(i.subtotal)}</div></div>
  <div class="field"><label>tax_total</label><div>${D.money(i.tax_total)}</div></div>
  <div class="field"><label>due_date</label><div>${i.due_date}</div></div>
  <div class="field"><label>currency</label><div>${i.currency}</div></div>
</div></div>
<p class="hint">WF: AP_INVOICE_APPROVAL · Docs: FACT,OC,REC · Audit: AP_INVOICE_*</p>`;})()
;
  
});
</script></body></html>
