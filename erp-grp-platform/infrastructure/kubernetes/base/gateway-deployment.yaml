apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: erpgrp-edge
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/org/erpgrp/gateway-service:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: IAM_URI
              value: http://iam-service.erpgrp-core.svc.cluster.local
            - name: BUDGET_URI
              value: http://budget-service.erpgrp-grp.svc.cluster.local
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: erpgrp-edge
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: erpgrp-edge
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
spec:
  ingressClassName: nginx
  rules:
    - host: api.erpgrp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
