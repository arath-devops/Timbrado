apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-service
  namespace: erpgrp-grp
  labels:
    app: budget-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: budget-service
  template:
    metadata:
      labels:
        app: budget-service
    spec:
      containers:
        - name: budget-service
          image: ghcr.io/org/erpgrp/budget-service:1.0.0
          ports:
            - containerPort: 8091
          envFrom:
            - configMapRef:
                name: platform-config
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8091
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8091
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: budget-service
  namespace: erpgrp-grp
spec:
  selector:
    app: budget-service
  ports:
    - port: 80
      targetPort: 8091
