<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ERP · Login</title>
  <style>
    :root { --brand:#0a6ed1; --bg:#f0f2f5; --ink:#1a2332; --muted:#4a5568; --border:#d8dee6; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background: linear-gradient(160deg,#e8f3fc,#f0f2f5 45%,#e8ecf1); color:var(--ink); min-height:100vh; display:grid; place-items:center; }
    .card { width:min(400px,92vw); background:#fff; border:1px solid var(--border); border-radius:6px; padding:28px 24px; box-shadow:0 1px 3px rgba(26,35,50,.08); }
    .brand { display:flex; gap:10px; align-items:center; margin-bottom:18px; }
    .mark { width:36px; height:36px; border-radius:6px; background:var(--brand); color:#fff; display:grid; place-items:center; font-weight:700; font-size:12px; }
    h1 { margin:0 0 6px; font-size:22px; }
    .sub { margin:0 0 18px; color:var(--muted); font-size:13px; }
    label { display:block; font-size:12px; font-weight:600; margin:0 0 4px; color:var(--muted); }
    input { width:100%; height:36px; border:1px solid var(--border); border-radius:4px; padding:0 10px; margin-bottom:12px; }
    input:focus { outline:2px solid #e8f3fc; border-color:var(--brand); }
    .password-field { position:relative; margin-bottom:12px; }
    .password-field input { margin-bottom:0; padding-right:40px; }
    .toggle-password {
      position:absolute; right:4px; top:50%; transform:translateY(-50%);
      width:32px; height:28px; border:0; border-radius:4px; background:transparent;
      color:var(--muted); cursor:pointer; padding:0; display:grid; place-items:center;
    }
    .toggle-password:hover { color:var(--brand); background:#f0f2f5; }
    .toggle-password:focus-visible { outline:2px solid #e8f3fc; color:var(--brand); }
    .toggle-password svg { width:18px; height:18px; display:block; }
    .toggle-password svg[hidden] { display:none; }
    button[type="submit"] { width:100%; height:38px; border:0; border-radius:4px; background:var(--brand); color:#fff; font-weight:700; cursor:pointer; margin-top:6px; }
    button[type="submit"]:hover { background:#0854a0; }
    .err { display:none; background:#fce8e8; color:#bb0000; padding:8px 10px; border-radius:4px; font-size:13px; margin-bottom:10px; }
    .ok { display:none; background:#e3f5ea; color:#107e3e; padding:10px; border-radius:4px; font-size:12px; margin-top:12px; white-space:pre-wrap; word-break:break-all; }
    .hint { font-size:11px; color:var(--muted); margin-top:12px; }
  </style>
</head>
<body>
  <form class="card" id="f">
    <div class="brand">
      <div class="mark">ERP</div>
      <div>
        <strong>ACME Industrial</strong>
        <div style="font-size:12px;color:var(--muted)" data-i18n="brandSubtitle">Inicio de sesión</div>
      </div>
    </div>
    <h1 data-i18n="title">Entrar</h1>
    <p class="sub" data-i18n="subtitle">Empresa, usuario y contraseña. Los permisos los asigna el administrador.</p>
    <div class="err" id="err"></div>
    <label for="company" data-i18n="company">Empresa</label>
    <input id="company" name="company" value="ACME" autocomplete="organization" required data-required-key="requiredCompany"/>
    <label for="username" data-i18n="username">Usuario</label>
    <input id="username" name="username" value="admin.acme" autocomplete="username" required data-required-key="requiredUsername"/>
    <label for="password" data-i18n="password">Contraseña</label>
    <div class="password-field">
      <input id="password" name="password" type="password" value="demo1234" autocomplete="current-password" required data-required-key="requiredPassword"/>
      <button type="button" class="toggle-password" id="togglePassword" aria-pressed="false">
        <svg id="iconShow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg id="iconHide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"/>
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"/>
          <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
    </div>
    <button type="submit" data-i18n="submit">Entrar</button>
    <p class="hint" data-i18n-html="hint">Demo: empresa <code>ACME</code> · <code>admin.acme</code> o <code>compras.acme</code> · pass <code>demo1234</code></p>
    <div class="ok" id="ok"></div>
  </form>
  <script>
    const MESSAGES = {
      es: {
        documentTitle: 'ERP · Iniciar sesión',
        brandSubtitle: 'Inicio de sesión',
        title: 'Entrar',
        subtitle: 'Empresa, usuario y contraseña. Los permisos los asigna el administrador.',
        company: 'Empresa',
        username: 'Usuario',
        password: 'Contraseña',
        submit: 'Entrar',
        hint: 'Demo: empresa <code>ACME</code> · <code>admin.acme</code> o <code>compras.acme</code> · pass <code>demo1234</code>',
        requiredCompany: 'Ingresa la empresa',
        requiredUsername: 'Ingresa el usuario',
        requiredPassword: 'Ingresa la contraseña',
        requiredGeneric: 'Este campo es obligatorio',
        showPassword: 'Mostrar contraseña',
        hidePassword: 'Ocultar contraseña',
        loginFailed: (status) => 'No se pudo iniciar sesión (error ' + status + ')',
        connectFailed: (msg) => 'No se pudo conectar: ' + msg,
        sessionOk: (name, company, modules, menuCount, menuJson) =>
          'Sesión OK\n' + name + ' @ ' + company + '\n' +
          'Módulos: ' + modules + '\n\n' +
          'Menú (' + menuCount + ' secciones):\n' + menuJson
      },
      en: {
        documentTitle: 'ERP · Sign in',
        brandSubtitle: 'Sign in',
        title: 'Sign in',
        subtitle: 'Company, username and password. Permissions are assigned by an administrator.',
        company: 'Company',
        username: 'Username',
        password: 'Password',
        submit: 'Sign in',
        hint: 'Demo: company <code>ACME</code> · <code>admin.acme</code> or <code>compras.acme</code> · pass <code>demo1234</code>',
        requiredCompany: 'Enter the company',
        requiredUsername: 'Enter the username',
        requiredPassword: 'Enter the password',
        requiredGeneric: 'This field is required',
        showPassword: 'Show password',
        hidePassword: 'Hide password',
        loginFailed: (status) => 'Could not sign in (error ' + status + ')',
        connectFailed: (msg) => 'Could not connect: ' + msg,
        sessionOk: (name, company, modules, menuCount, menuJson) =>
          'Signed in\n' + name + ' @ ' + company + '\n' +
          'Modules: ' + modules + '\n\n' +
          'Menu (' + menuCount + ' sections):\n' + menuJson
      }
    };

    /** Prefer OS/browser language: es-MX, es-ES → es; en-US → en. Default: Spanish. */
    function detectLanguage() {
      const candidates = [...(navigator.languages || []), navigator.language, navigator.userLanguage]
        .filter(Boolean)
        .map((l) => String(l).toLowerCase());
      for (const locale of candidates) {
        if (locale.startsWith('es')) return 'es';
        if (locale.startsWith('en')) return 'en';
      }
      return 'es';
    }

    const lang = detectLanguage();
    const t = MESSAGES[lang] || MESSAGES.es;
    document.documentElement.lang = lang;
    document.title = t.documentTitle;

    document.querySelectorAll('[data-i18n]').forEach((el) => {
      const key = el.getAttribute('data-i18n');
      if (t[key]) el.textContent = t[key];
    });
    document.querySelectorAll('[data-i18n-html]').forEach((el) => {
      const key = el.getAttribute('data-i18n-html');
      if (t[key]) el.innerHTML = t[key];
    });

    const err = document.getElementById('err');
    const ok = document.getElementById('ok');
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const iconShow = document.getElementById('iconShow');
    const iconHide = document.getElementById('iconHide');

    const setToggleLabels = (passwordVisible) => {
      const label = passwordVisible ? t.hidePassword : t.showPassword;
      togglePassword.setAttribute('aria-label', label);
      togglePassword.setAttribute('aria-pressed', String(passwordVisible));
      togglePassword.title = label;
    };
    setToggleLabels(false);

    togglePassword.addEventListener('click', () => {
      const visible = passwordInput.type === 'text';
      passwordInput.type = visible ? 'password' : 'text';
      iconShow.hidden = !visible;
      iconHide.hidden = visible;
      setToggleLabels(!visible);
    });

    const requiredInputs = document.querySelectorAll('#f input[required]');
    requiredInputs.forEach((input) => {
      const key = input.dataset.requiredKey;
      const requiredMsg = (key && t[key]) || t.requiredGeneric;
      const refreshValidity = () => {
        if (input.validity.valueMissing) {
          input.setCustomValidity(requiredMsg);
        } else {
          input.setCustomValidity('');
        }
      };
      input.addEventListener('invalid', refreshValidity);
      input.addEventListener('input', () => input.setCustomValidity(''));
      input.addEventListener('blur', refreshValidity);
    });

    document.getElementById('f').onsubmit = async (e) => {
      e.preventDefault();
      err.style.display = 'none'; ok.style.display = 'none';
      const form = e.target;
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }
      const body = {
        company: document.getElementById('company').value.trim(),
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      };
      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept-Language': lang
          },
          body: JSON.stringify(body)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          err.textContent = data.message || data.detail || t.loginFailed(res.status);
          err.style.display = 'block';
          return;
        }
        sessionStorage.setItem('erp_access_token', data.accessToken);
        sessionStorage.setItem('erp_user', JSON.stringify(data.user));
        sessionStorage.setItem('erp_lang', lang);
        const menuRes = await fetch('/api/v1/me/menus', {
          headers: {
            Authorization: 'Bearer ' + data.accessToken,
            'Accept-Language': lang
          }
        });
        const menu = await menuRes.json();
        ok.style.display = 'block';
        ok.textContent = t.sessionOk(
          data.user.displayName,
          data.user.companyName,
          (data.user.modules || []).join(', '),
          (menu.items || []).length,
          JSON.stringify(menu.items, null, 2)
        );
      } catch (ex) {
        err.textContent = t.connectFailed(ex.message);
        err.style.display = 'block';
      }
    };
  </script>
</body>
</html>
