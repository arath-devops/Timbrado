<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ERP · Iniciar sesión</title>
  <style>
    :root { --brand:#0a6ed1; --bg:#f0f2f5; --ink:#1a2332; --muted:#4a5568; --border:#d8dee6; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background: linear-gradient(160deg,#e8f3fc,#f0f2f5 45%,#e8ecf1); color:var(--ink); min-height:100vh; display:grid; place-items:center; }
    .card { width:min(400px,92vw); background:#fff; border:1px solid var(--border); border-radius:6px; padding:28px 24px; box-shadow:0 1px 3px rgba(26,35,50,.08); }
    .brand { display:flex; gap:10px; align-items:center; margin-bottom:18px; }
    .mark { width:36px; height:36px; border-radius:6px; background:var(--brand); color:#fff; display:grid; place-items:center; font-weight:700; font-size:12px; }
    h1 { margin:0 0 6px; font-size:22px; }
    .sub { margin:0 0 18px; color:var(--muted); font-size:13px; }
    label { display:block; font-size:12px; font-weight:600; margin:0 0 4px; color:var(--muted); }
    input { width:100%; height:36px; border:1px solid var(--border); border-radius:4px; padding:0 10px; margin-bottom:12px; }
    input:focus { outline:2px solid #e8f3fc; border-color:var(--brand); }
    button { width:100%; height:38px; border:0; border-radius:4px; background:var(--brand); color:#fff; font-weight:700; cursor:pointer; margin-top:6px; }
    button:hover { background:#0854a0; }
    .err { display:none; background:#fce8e8; color:#bb0000; padding:8px 10px; border-radius:4px; font-size:13px; margin-bottom:10px; }
    .ok { display:none; background:#e3f5ea; color:#107e3e; padding:10px; border-radius:4px; font-size:12px; margin-top:12px; white-space:pre-wrap; word-break:break-all; }
    .hint { font-size:11px; color:var(--muted); margin-top:12px; }
  </style>
</head>
<body>
  <form class="card" id="f">
    <div class="brand">
      <div class="mark">ERP</div>
      <div><strong>ACME Industrial</strong><div style="font-size:12px;color:var(--muted)">Inicio de sesión</div></div>
    </div>
    <h1>Entrar</h1>
    <p class="sub">Empresa, usuario y contraseña. Los permisos los asigna el administrador.</p>
    <div class="err" id="err"></div>
    <label for="company">Empresa</label>
    <input id="company" name="company" value="ACME" autocomplete="organization" required/>
    <label for="username">Usuario</label>
    <input id="username" name="username" value="admin.acme" autocomplete="username" required/>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" value="demo1234" autocomplete="current-password" required/>
    <button type="submit">Entrar</button>
    <p class="hint">Demo: empresa <code>ACME</code> · <code>admin.acme</code> o <code>compras.acme</code> · pass <code>demo1234</code></p>
    <div class="ok" id="ok"></div>
  </form>
  <script>
    const err = document.getElementById('err');
    const ok = document.getElementById('ok');
    document.getElementById('f').onsubmit = async (e) => {
      e.preventDefault();
      err.style.display = 'none'; ok.style.display = 'none';
      const body = {
        company: document.getElementById('company').value.trim(),
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      };
      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          err.textContent = data.message || data.detail || ('Error ' + res.status);
          err.style.display = 'block';
          return;
        }
        sessionStorage.setItem('erp_access_token', data.accessToken);
        sessionStorage.setItem('erp_user', JSON.stringify(data.user));
        const menuRes = await fetch('/api/v1/me/menus', {
          headers: { Authorization: 'Bearer ' + data.accessToken }
        });
        const menu = await menuRes.json();
        ok.style.display = 'block';
        ok.textContent = 'Sesión OK\n' +
          data.user.displayName + ' @ ' + data.user.companyName + '\n' +
          'Módulos: ' + (data.user.modules || []).join(', ') + '\n\n' +
          'Menú (' + (menu.items || []).length + ' secciones):\n' +
          JSON.stringify(menu.items, null, 2);
      } catch (ex) {
        err.textContent = 'No se pudo conectar: ' + ex.message;
        err.style.display = 'block';
      }
    };
  </script>
</body>
</html>
