# Perfil local: H2 en memoria, sin Redis/Kafka — para probar login en línea
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: jdbc:h2:mem:iam_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration-h2
  h2:
    console:
      enabled: true

erpgrp:
  security:
    public-paths: /actuator/health/**,/actuator/info,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/api/v1/meta/**,/oauth2/token,/oauth2/jwks,/api/v1/iam/oauth2/**,/api/v1/auth/**,/login.html,/assets/**
  jwt:
    issuer: http://localhost:8081
    access-token-minutes: 60

logging:
  level:
    mx.gov.erpgrp.iam: INFO
