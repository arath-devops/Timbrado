<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ERP+GRP Preview · Municipio de Ejemplo</title>
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
</head>
<body>
  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">EG</div>
        <div class="brand-text">
          <strong>ERP+GRP</strong>
          <span>Municipio de Ejemplo</span>
        </div>
      </div>
      <div class="nav-scroll" id="nav-root"></div>
    </aside>

    <header class="topbar">
      <button class="icon-btn" id="btn-sidebar" title="Colapsar menú" aria-label="Menú">☰</button>
      <div class="search">
        <span class="search-ico">⌕</span>
        <input id="global-search" type="search" placeholder="Buscar solicitudes, tareas, expedientes… (Enter)" />
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-theme" title="Cambiar tema"><span data-theme-label>Claro</span></button>
        <button class="icon-btn" id="btn-notif" title="Notificaciones">🔔</button>
        <button class="icon-btn" title="Favoritos" onclick="location.hash='#/iam/perfil'">★</button>
        <button class="user-chip" id="btn-profile" type="button">
          <div class="avatar" id="user-avatar">MR</div>
          <div class="user-meta">
            <strong id="user-name">Mariana Ríos</strong>
            <span id="user-role">Director de Administración</span>
          </div>
        </button>
        <button class="icon-btn" title="Salir" onclick="sessionStorage.clear();location.href='index.html'">⎋</button>
      </div>
    </header>

    <main class="main">
      <div id="main-view" class="fade-in"></div>
    </main>
  </div>

  <div class="toast-host" id="toast-host"></div>
  <div class="context-menu" id="context-menu">
    <button type="button" onclick="ERPUI.toast('Abrir en panel (simulado)')">Abrir</button>
    <button type="button" onclick="ERPUI.toast('Añadido a favoritos')">Añadir a favoritos</button>
    <button type="button" onclick="ERPUI.toast('Copiado al portapapeles')">Copiar ID</button>
    <button type="button" onclick="location.hash='#/auditoria'">Ver auditoría</button>
  </div>

  <script src="assets/js/theme.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/helpers.js"></script>
  <script src="assets/js/views-core.js"></script>
  <script src="assets/js/views-domain.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
