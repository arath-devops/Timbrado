name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp-grp-platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B -DskipTests=false verify
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp-grp-platform/frontend/apps/shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: erp-grp-platform/frontend/apps/shell/package.json
      - name: Install and build
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
            npm run build --if-present
          else
            echo "Frontend package not ready"
          fi

  docker:
    needs: [backend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build iam-service image
        run: |
          docker build -f erp-grp-platform/infrastructure/docker/Dockerfile.service \
            --build-arg SERVICE=iam-service \
            -t erpgrp/iam-service:${{ github.sha }} \
            erp-grp-platform
